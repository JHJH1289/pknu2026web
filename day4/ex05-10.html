<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>달력</title>
  <style>
    .wrapper {
      width: 245px;
      background-color: beige;
      padding: 6px;
      box-sizing: border-box;
    }

    .wrapper::after {
      content: "";
      display: block;
      clear: both;
    }

    .wrapper > div {
      float: left;
      width: 28px;
      height: 28px;
      line-height: 28px;
      margin: 4px;
      font-size: 1.1rem;
      text-align: center;
      border: 1px solid #6f88a8;
      background-color: #fffbe8;
      box-sizing: border-box;
    }

    .wrapper > div:nth-of-type(7n) {
      color: blue;
    }

    .wrapper > div:nth-of-type(2),
    .wrapper > div:nth-of-type(7n + 1) {
      color: red;
    }

    .wrapper > div:nth-of-type(n + 25) {
      background-color: rgb(207, 253, 255);
    }

    h2 {
      width: 245px;
      margin: 0;
      padding: 6px 0;
      text-align: center;
      color: white;
      background-color: #1f5d99;
      font-size: 1.5rem;
    }

    .wrapper > div {
    margin: 4px;
    font-size: 1.1rem;
}

.wrapper > div:nth-of-type(7n) {
    color: blue;
}

.wrapper > div:nth-of-type(2),
.wrapper > div:nth-of-type(7n + 1) {
    color: red;
}

.wrapper > div:nth-of-type(-n + 6) {
    background-color: rgb(162, 248, 151);
}

.wrapper > div:nth-of-type(n + 25) {
    background-color: rgb(207, 253, 255);
}

.wrapper > div:nth-of-type(n + 12):nth-of-type(-n + 18) {
    background-color: rgb(251, 255, 0);
}
  </style>
</head>
<body>
  <h1>달력</h1>
  <hr />
  <a href="index.html">홈으로</a>
  <br /><br />

  <h2>2026년 3월 달력</h2>

</body>
</html>
