

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>학점 매기기</title>
  <script>
    function calculateGrade() {
      const scoreInput = document.getElementById("scoreInput");
      const score = parseInt(scoreInput.value);

      if (isNaN(score)) {
        alert("유효한 숫자를 입력해주세요.");
        return;
      }

      if (score < 0 || score > 100) {
        alert("점수는 0부터 100 사이의 값으로 입력해주세요.");
        return;
      }

      let grade;

      if (score >= 90) {
        grade = "A : 잘했어요!";
      } else if (score >= 80) {
        grade = "B : 잘하고 있어요!";
      } else if (score >= 70) {
        grade = "C : 에반데;;";
      } else if (score >= 60) {
        grade = "D : 어허...";
      } else {
        grade = "F : 그냥 다시 태어나십시오 ^^7";
      }

      alert(`점수: ${score}, 학점: ${grade}`);
    }
  </script>
</head>
<body>
  <h1 id="title">학점 매기기</h1>
  <hr>
  <label for="scoreInput">점수를 입력하세요 (0-100):</label>
  <input type="number" id="scoreInput" min="0" max="100">
  <button onclick="calculateGrade()">계산</button>
  <a href="08-03.html">홈으로</a>
</body>
</html>
