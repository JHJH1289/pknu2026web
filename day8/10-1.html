<!doctype html>
<html lang="ko">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>함수선언식으로 게임</title>
</head>

<body>
    영웅의 이름을 입력하세요 <input type="text" id="heroName" /> <br />
    영웅의 레벨을 입력하세요 <input type="text" id="herolevel" /> <br />
    영웅의 스킬을 입력하세요 <input type="text" id="skill" onkeypress="press(event)" /><br />
    <button onclick="executeGame()">실행</button>
    <hr />

    <div id="result"></div>

    <script>

        function press(e) {
            if (e.key === "Enter") {
                executeGame();
            }
        }


        function executeGame() {
            const heroName = document.getElementById("heroName").value;
            const herolevel = parseInt(document.getElementById("herolevel").value);
            const skill = document.getElementById("skill").value;
            const result = document.getElementById("result");

            result.innerHTML = "";

            if (isNaN(herolevel) || herolevel < 1) {
                alert("레벨은 1 이상의 숫자로 입력해주세요.");
                return;
            }

            switch (skill.toLowerCase()) {
                case "fire":
                    lol(heroName, herolevel, fire);
                    break;
                case "ice":
                    lol(heroName, herolevel, ice);
                    break;
                case "slow":
                    lol(heroName, herolevel, slow);
                    break;
                default:
                    alert("스킬은 'fire', 'ice', 'slow' 중 하나로 입력해주세요.");
            }

            function print(text) {
                result.innerHTML += text + "<br>";
            }

            function lol(heroName, level = herolevel, cb) {
                print("==========================");
                print(`${heroName}님이 ${level}레벨이 되었습니다.`);
                print("==========================");

                if (level >= 6) {
                    print(`${heroName}님이 궁극기를 씁니다.`);
                    cb(level);
                } else {
                    print(`${heroName}님이 깨작 평타를 때립니다.`);
                }
            }

            function fire(ff) {
                for (let i = 1; i <= ff; i++) {
                    print(`${ff}레벨이어서 ${i}개 메테오를 던집니다.`);
                }
            }

            function ice(ii) {
                for (let i = 1; i < ii; i++) {
                    print(`${ii}레벨이어서 ${i * 2}개 얼음을 던집니다.`);
                }
            }

            function slow(ss) {
                for (let i = ss; i > 0; i--) {
                    print(`${ss}레벨이어서 다리를 공격하여 이동속도를 ${i}% 줄입니다.`);
                }
            }
        }
    </script>
</body>
</html>
