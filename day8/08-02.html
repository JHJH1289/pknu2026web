<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title></title>
  <script>
    const name = prompt("이름을 입력하세요:");
    console.log(`안녕하세요, ${name}님!`);
    alert(`안녕하세요, ${name}님!`);
    name !== "관리자" ||
        document.write(`<p>관리자님, 환영합니다!</p>`);
    name == "관리자" ||
        document.write(`<p>${name} 사용자님, 환영합니다!</p>`);

  </script>
</head>
<body>
  <h1></h1>
  <hr>
  <a href="index.html">홈으로</a><br>
  
</body>
