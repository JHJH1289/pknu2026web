<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>오늘의 문제 2</title>
</head>
<body>
  <h1>오늘의 문제 2</h1>
  <hr>
  <a href="index.html">홈으로</a><br>
   <script>
      /* 중요한 문제 */
      // 첫째 시작값을 입력받고
      // 두번째 끝값을 입력받아
      // 그값을 모두 더한값 합산을 출력하라.
      // html 페이지에 출력
      // 예) 4 부터 7까지의 합은 22이다.
    const start = parseInt(prompt("시작값을 입력하세요."));
    const end = parseInt(prompt("끝값을 입력하세요."));
    let result = 0;

    for (let i = start; i <= end; i++) {
      result += i;
    }
    document.body.innerHTML = ` ${start} 부터 ${end}까지의 합은 ${result}입니다.`;
    </script>
</body>
</html>
