<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <table width="100%">
        <caption>
            선물용과 가정용 상품구성
        </caption>
        <colgroup>
            <col style="background-color: bisque">
            <col style="background-color: #4f78ad;">
            <col style="background-color: rgb(77, 199, 221);">
        </colgroup>
        <thead style="text-align: center;">
            <tr>
                <th>용도</th>
                <th>중량</th>
                <th>개수</th>
                <th>가격</th>
            </tr>
            <tr>
                <td rowspan="2">선물용</td>
                <td>3kg</td>
                <td>11~16</td>
                <td>38,000원</td>
            </tr>
            <tr>
                <!-- <td>선물용</td> -->
                <td>5kg</td>
                <td>17~22</td>
                <td>58,000원</td>
            </tr>
            <tr>
                <td rowspan="2">가정용</td>
                <td>3kg</td>
                <td>11~16</td>
                <td>48,000원</td>
            </tr>
            <tr>
                <!-- <td>가정용</td> -->
                <td>5kg</td>
                <td>17~22</td>
                <td>68,000원</td>
        </thead>
    </table>
</body>
</html>
