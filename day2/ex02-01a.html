<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>구글폼 연동</title>
  <style>
    body {
      margin: 0;
      padding: 40px 20px;
      font-family: "Malgun Gothic", "맑은 고딕", sans-serif;
      background-color: #f4f6f8;
      color: #222;
    }

    .wrap {
      max-width: 600px;
      margin: 0 auto;
      background: #ffffff;
      padding: 30px;
      border-radius: 14px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin-top: 0;
      margin-bottom: 10px;
      font-size: 28px;
      text-align: center;
      color: #1a73e8;
    }

    .sub {
      text-align: center;
      color: #666;
      margin-bottom: 30px;
      font-size: 14px;
    }

    .home-link {
      display: inline-block;
      margin-bottom: 20px;
      text-decoration: none;
      color: #1a73e8;
      font-weight: bold;
    }

    .home-link:hover {
      text-decoration: underline;
    }

    .question-box {
      margin-bottom: 24px;
      padding: 18px;
      border: 1px solid #e3e7eb;
      border-radius: 10px;
      background-color: #fafbfc;
    }

    .question-title {
      display: block;
      margin-bottom: 12px;
      font-size: 16px;
      font-weight: bold;
      color: #333;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px;
      border: 1px solid #cfd8dc;
      border-radius: 8px;
      font-size: 15px;
      box-sizing: border-box;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: #1a73e8;
      box-shadow: 0 0 0 3px rgba(26, 115, 232, 0.15);
    }

    .option {
      display: block;
      margin-bottom: 10px;
      font-size: 15px;
      cursor: pointer;
    }

    .option input {
      margin-right: 8px;
    }

    .btn-area {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-top: 30px;
    }

    input[type="submit"],
    input[type="reset"] {
      border: none;
      border-radius: 8px;
      padding: 12px 20px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    input[type="submit"] {
      background-color: #1a73e8;
      color: white;
    }

    input[type="submit"]:hover {
      background-color: #155cc0;
    }

    input[type="reset"] {
      background-color: #e0e0e0;
      color: #333;
    }

    input[type="reset"]:hover {
      background-color: #cfcfcf;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <a class="home-link" href="index.html">홈으로</a>

    <h1>데이터 수집</h1>
    <p class="sub">구글폼 연동 예제</p>

    <form
      action="https://docs.google.com/forms/d/e/1FAIpQLSeU06fSG-pPj_h6099nIx-ET5Ru6XK3AqcmyZILNhy_8cQJcg/formResponse"
      method="post"
      target="_blank"
    >
      <div class="question-box">
        <label class="question-title" for="lastName">성</label>
        <input type="text" id="lastName" name="entry.856230268" required />
      </div>

      <div class="question-box">
        <label class="question-title" for="firstName">이름</label>
        <input type="text" id="firstName" name="entry.1087389677" required />
      </div>

      <div class="question-box">
        <span class="question-title">아침을 드셨나요?</span>
        <label class="option">
          <input type="checkbox" name="entry.1288241121" value="밥을 먹는다." />
          밥을 먹는다.
        </label>
        <label class="option">
          <input type="checkbox" name="entry.1288241121" value="빵을 먹는다." />
          빵을 먹는다.
        </label>
      </div>

      <div class="question-box">
        <span class="question-title">학생인가요?</span>
        <label class="option">
          <input type="radio" name="entry.447216743" value="예" required />
          예
        </label>
        <label class="option">
          <input type="radio" name="entry.447216743" value="아니오" />
          아니오
        </label>
      </div>

      <div class="question-box">
        <span class="question-title">공부를 잘하시나요?</span>
        <label class="option">
          <input type="radio" name="entry.1635308141" value="잘함" required />
          잘함
        </label>
        <label class="option">
          <input type="radio" name="entry.1635308141" value="못함" />
          못함
        </label>
      </div>

      <div class="btn-area">
        <input type="submit" value="제출" />
        <input type="reset" value="초기화" />
      </div>
    </form>
  </div>
</body>
</html>
