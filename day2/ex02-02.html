<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>input 응용</title>
</head>
<body>
  <h1>input 응용</h1>
  <hr>

  <a href="index.html">홈으로</a>

  <br><br>

  <form>
    <fieldset>
      <legend>로그인양식</legend>

      <label for="userId">아이디:</label>
      <input type="text" id="userId" name="userId" placeholder="아이디를 입력하세요">
      <br>

      <label for="userPw">비번:</label>
      <input type="password" id="userPw" name="userPw" placeholder="비번을 입력하세요">
      <br><br>

      <input type="submit" value="제출">
      <input type="reset" value="초기화">
    </fieldset>

    <br>

    <fieldset>
      <legend>그외 양식</legend>

      <label for="today">날짜:</label>
      <input type="date" id="today" name="today">

      <label for="nowTime">시간:</label>
      <input type="time" id="nowTime" name="nowTime">
      <br />
      <input type="file" id="upload" name="upload"><br />
      <input type="submit" value="제출">
      <input type="reset" value="초기화">
    </fieldset>
  </form>
</body>
</html>
